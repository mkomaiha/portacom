name: Release

# Publishes portacom, winmd2py and portacom-dxc to PyPI when a GitHub release
# is published, after lint and the tests pass. The release tag (vX.Y.Z) must
# match the version of every package. Uses PyPI trusted publishing: each
# project must first list this repository, workflow release.yml and
# environment "pypi" as a trusted publisher.

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Check the tag matches the package versions
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os, sys, tomllib
          tag = os.environ["TAG"]
          ok = True
          for package in ("runtime", "generator", "dxc"):
              with open(f"{package}/pyproject.toml", "rb") as f:
                  version = tomllib.load(f)["project"]["version"]
              if tag != f"v{version}":
                  print(f"::error::{package}/pyproject.toml has version {version}, but the tag is {tag}")
                  ok = False
          sys.exit(0 if ok else 1)
          PY

      - run: pip install build
      - run: |
          for package in runtime generator dxc; do
            python -m build --outdir dist "$package"
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3 (release/v1)
        with:
          # files already on PyPI are skipped, so a re-run after a partial upload succeeds
          skip-existing: true
