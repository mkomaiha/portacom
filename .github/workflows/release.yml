name: Release

# Publishes portacom, winmd2py and portacom-dxc to PyPI when a GitHub release
# is published, after lint and the tests pass. The release tag (vX.Y.Z) must
# match the version of every package. Uses PyPI trusted publishing: each
# project must first list this repository, workflow release.yml and its own
# environment (pypi-portacom, pypi-winmd2py, pypi-portacom-dxc) as a trusted
# publisher; PyPI allows one pending publisher per environment.

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Check the tag matches the package versions
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os, sys, tomllib
          tag = os.environ["TAG"]
          ok = True
          for package in ("runtime", "generator", "dxc"):
              with open(f"{package}/pyproject.toml", "rb") as f:
                  version = tomllib.load(f)["project"]["version"]
              if tag != f"v{version}":
                  print(f"::error::{package}/pyproject.toml has version {version}, but the tag is {tag}")
                  ok = False
          sys.exit(0 if ok else 1)
          PY

      - run: pip install build
      - run: |
          python -m build --outdir dist/portacom runtime
          python -m build --outdir dist/winmd2py generator
          python -m build --outdir dist/portacom-dxc dxc
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist

  publish:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        package: [portacom, winmd2py, portacom-dxc]
    runs-on: ubuntu-latest
    environment: pypi-${{ matrix.package }}
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3 (release/v1)
        with:
          packages-dir: dist/${{ matrix.package }}
          # files already on PyPI are skipped, so a re-run after a partial upload succeeds
          skip-existing: true
