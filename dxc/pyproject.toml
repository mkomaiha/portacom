[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "portacom-dxc"
version = "0.1.0"
description = "DirectX Shader Compiler from Python on Windows, Linux and macOS, through portacom"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{ name = "Mahmoud Komaiha", email = "mkomaiha@umich.edu" }]
requires-python = ">=3.10"
# the generated bindings use portacom internals: stay within one minor version
dependencies = ["portacom>=0.1,<0.2"]
keywords = ["dxc", "hlsl", "dxil", "shader", "directx", "com", "ctypes"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Software Development :: Compilers",
]

[project.urls]
Homepage = "https://github.com/mkomaiha/portacom"
Repository = "https://github.com/mkomaiha/portacom"
Issues = "https://github.com/mkomaiha/portacom/issues"
Changelog = "https://github.com/mkomaiha/portacom/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]
